function read(k,def){try{let v=localStorage.getItem(k);return v===null?def:JSON.parse(v)}catch(e){return def}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function getProfiles(){const p=read(PROFILES,[]);return Array.isArray(p)?p.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&Array.isArray(x.seen)):[]}

function profileFor(name){return getProfiles().find(p=>p.name.toLocaleLowerCase('fr')===name.toLocaleLowerCase('fr'))}
function createProfile(name){let p=getProfiles();let found=p.find(x=>x.name.toLocaleLowerCase('fr')===name.toLocaleLowerCase('fr'));if(found)return found;const item={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,9),name,seen:[]};p.push(item);putProfiles(p);return item}
function questionId(theme,n,idx=0){return theme+'::'+n+'::'+idx}
function seenBy(name,theme,n,idx=0){const id=S.profileIds?.[name];return getProfiles().some(p=>p.id===id&&p.seen.includes(questionId(theme,n,idx)))}
function recordSeen(name,theme,n,idx=0){const id=S.profileIds?.[name];if(!id)return;const p=getProfiles(),one=p.find(x=>x.id===id),key=questionId(theme,n,idx);if(one&&!one.seen.includes(key)){one.seen.push(key);putProfiles(p)}}
function variantsFor(theme,n){let t=bank.ratings.find(x=>x.theme===theme);if(!t)return [];return [{q:t.q[n-1],a:t.a[n-1],idx:0},...(variants[theme]?.[n-1]?[{...variants[theme][n-1],idx:1}]:[])]}
function availableQuestion(name,theme,n){const pool=variantsFor(theme,n);let unseen=pool.filter(x=>!seenBy(name,theme,n,x.idx));return shuffle(unseen.length?unseen:pool)[0]}

function validSave(s){return s&&s.type==='ratings'&&Array.isArray(s.names)&&s.names.length>=2&&s.names.length<=10&&Number.isInteger(s.round)&&s.round>=1&&s.round<=20&&[5,10,20].includes(s.limit)&&s.scores&&s.topic&&bank.ratings.some(t=>t.theme===s.topic.theme)&&Array.isArray(s.order)&&s.order.length===s.names.length&&s.picks&&['pick','question','between'].includes(s.stage)}
function pickTheme(){let used=read(HISTORY,[]);if(!Array.isArray(used))used=[];const all=bank.ratings.map(t=>t.theme);used=used.filter(t=>all.includes(t));let choices=all.filter(t=>!used.includes(t));if(!choices.length){const last=used[used.length-1];used=[];choices=all.filter(t=>t!==last);if(!choices.length)choices=all}const playerNames=S.names||[];const scored=choices.map(theme=>({theme,seen:playerNames.reduce((total,player)=>total+Array.from({length:10},(_,i)=>seenBy(player,theme,i+1)?1:0).reduce((a,b)=>a+b,0),0)}));const min=Math.min(...scored.map(x=>x.seen));const eligible=scored.filter(x=>x.seen===min);const name=eligible[Math.floor(Math.random()*eligible.length)].theme;used.push(name);write(HISTORY,used);return bank.ratings.find(t=>t.theme===name)}

function addPlayer(){if(W.names.length>=10)return;let input=document.getElementById('playerName'),name=input.value.trim();if(!name){alert('Entre un prénom.');input.focus();return}if(W.names.some(x=>x.toLocaleLowerCase('fr')===name.toLocaleLowerCase('fr'))){alert('Ce prénom est déjà inscrit. Utilise un surnom différent.');input.focus();return}W.names.push(name);wizardPlayers()}
function removePlayer(i){W.names.splice(i,1);wizardPlayers()}
function wizardOptions(){if(W.names.length<2||W.names.length>10){wizardPlayers();return}app.innerHTML=`<div class="panel"><span class="tag">Étape 3 sur 3</span><h2>Options de la partie</h2><p><b>${W.limit} manches</b> · ${W.names.length} joueurs : ${W.names.map(esc).join(', ')}</p><div class="notice option-card"><label class="switch-row" for="jokers"><span class="switch-text"><strong>Activer les jokers</strong></span><input class="switch-input" type="checkbox" id="jokers" ${W.jokers?'checked':''}><span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span></label><p class="muted">${W.limit===20?'Chaque joueur dispose d’un joker Deuxième chance et d’un joker Changement de question pour toute la partie.':'Chaque joueur peut utiliser un seul joker au choix pendant toute la partie.'}</p></div><div class="notice option-card"><label class="switch-row" for="sounds"><span class="switch-text"><strong>Activer les sons</strong></span><input class="switch-input" type="checkbox" id="sounds" ${W.sounds?'checked':''}><span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span></label></div><p class="muted">La partie sera sauvegardée automatiquement sur cet appareil.</p><div class="row"><button onclick="start()">Commencer la partie</button><button class="secondary" onclick="backToPlayers()">← Retour</button></div></div>`}
function backToPlayers(){W.jokers=document.getElementById('jokers').checked;W.sounds=document.getElementById('sounds').checked;wizardPlayers()}
function start(){const names=[...W.names],n=W.limit;if(names.length<2||names.length>10)return wizardPlayers();const profileIds=Object.fromEntries(names.map(name=>[name,createProfile(name).id]));S={type:'ratings',round:0,names,profileIds,limit:n,jokers:document.getElementById('jokers').checked,sounds:document.getElementById('sounds').checked,jokerUsed:Object.fromEntries(names.map(x=>[x,[]])),scores:Object.fromEntries(names.map(x=>[x,0])),order:[],step:0,picks:{}};next()}
function scores(){return '<div class="panel"><b>Scores</b>'+S.names.map(n=>`<div class="score"><span>${esc(n)}</span><b>${S.scores[n]} pts</b></div>`).join('')+'</div>'}
function finish(){stop();clearSave();let sorted=[...S.names].sort((a,b)=>S.scores[b]-S.scores[a]);app.innerHTML=`<div class="panel"><h2>Partie terminée</h2><p>En tête : <b>${esc(sorted.filter(n=>S.scores[n]===S.scores[sorted[0]]).join(' et '))}</b></p></div>${scores()}<button onclick="setup()">Nouvelle partie</button>`}
function next(){stop();if(S.round>=S.limit)return finish();S.round++;S.topic=pickTheme();S.order=shuffle(S.names);S.picks={};S.step=0;S.lastValidation=null;S.stage='pick';save();ratingPick()}
function ratingPick(){S.stage='pick';save();let player=S.order[Object.keys(S.picks).length];app.innerHTML=`<div class="panel"><span class="tag">Thème ${S.round}/${S.limit}</span><h2>${esc(S.topic.theme)}</h2>${player?`<p>À <b>${esc(player)}</b> de choisir sa note.</p><p class="muted">Chaque note correspond à une difficulté de 1 à 10.</p><div class="grid">${Array.from({length:10},(_,i)=>`<button ${Object.values(S.picks).includes(i+1)?'disabled':''} onclick="choose(${i+1})">${i+1}</button>`).join('')}</div>`:'<p>Toutes les notes ont été choisies.</p><button onclick="ratingQuestion()">Afficher les questions</button>'}<p class="muted">${Object.entries(S.picks).map(([n,v])=>esc(n)+': '+v).join(' · ')}</p></div>${scores()}`}
function choose(n){if(!Number.isInteger(n)||n<1||n>10||Object.values(S.picks).includes(n)||Object.keys(S.picks).length>=S.names.length)return;S.picks[S.order[Object.keys(S.picks).length]]=n;ratingPick()}
function ratingQuestion(){S.step=0;S.current=null;S.displayKey=null;S.wasRepeated=false;S.stage='question';S.revealed=false;S.choice=null;S.options=null;save();ratingShow()}
function choicesFor(topic,n){let wrong=mcq[topic.theme]?.[n];if(!wrong)return null;return shuffle([topic.a[n-1],...wrong])}
function ratingShow(){S.stage='question';let name=S.order[S.step],n=S.picks[name];if(!S.current||S.current.name!==name){const item=availableQuestion(name,S.topic.theme,n);S.current={...item,name};S.wasRepeated=seenBy(name,S.topic.theme,n,item.idx);recordSeen(name,S.topic.theme,n,item.idx);S.options=item.idx===0?choicesFor(S.topic,n):null;S.choice=null;S.revealed=false;S.firstWrong=false}const item=S.current,opts=S.options,repeated=!!S.wasRepeated,used=S.jokerUsed?.[name]||[],quota=S.limit===20?2:1,canJoker=S.jokers&&used.length<quota;save();let jokerButtons='';if(canJoker&&!S.revealed){if(!used.includes('change')&&variantsFor(S.topic.theme,n).length>1)jokerButtons+='<button class="secondary" onclick="changeQuestion()">↻ Joker : changer de question</button>';if(S.firstWrong&&!used.includes('chance'))jokerButtons+='<button onclick="secondChance()">Joker : deuxième chance</button>'}app.innerHTML=`<div class="panel"><span class="tag">Manche ${S.round}/${S.limit} · ${esc(S.topic.theme)} · ${S.step+1}/${S.names.length}</span><h2>${esc(name)} — niveau ${n}</h2><p>${esc(item.q)}</p>${opts?`<p class="choice-label">QCM : annonce ta réponse à l’oral.</p><div id="options">${opts.map((o,i)=>`<button class="answer" onclick="selectOption(${i})" data-correct="${o===item.a}">${esc(o)}</button>`).join('')}</div>`:''}${!S.revealed?`<button class="secondary" onclick="revealAnswer()">Révéler la réponse</button><button class="secondary" onclick="declareWrong()">Mauvaise réponse : utiliser la deuxième chance ?</button>`:''}${jokerButtons}<div id="reveal" class="${S.revealed?'':'hidden'} notice"><b>Bonne réponse : ${esc(item.a)}</b><p>La réponse donnée est-elle correcte ?</p><button onclick="ratingMark(true)">Oui (+${n})</button><button class="secondary" onclick="ratingMark(false)">Non (0)</button></div>${S.firstWrong?'<p class="notice">Première réponse incorrecte. Utilise le joker Deuxième chance si disponible, sinon valide 0 point.</p>':''}</div>${scores()}<button class="secondary" onclick="undoLast()">↶ Annuler la dernière validation</button>`;if(S.revealed){document.querySelectorAll('#options button').forEach(b=>{b.disabled=true;if(b.dataset.correct==='true')b.classList.add('correct')})}else if(S.choice!==null&&opts){document.querySelectorAll('#options button').forEach((b,i)=>b.classList.toggle('on',i===S.choice))}}
function selectOption(i){let buttons=[...document.querySelectorAll('#options button')];if(S.revealed)return;buttons.forEach((b,j)=>b.classList.toggle('on',i===j));S.choice=i;save()}
function revealAnswer(){S.revealed=true;save();ratingShow()}
function ratingMark(ok){if(!S.revealed)return;const name=S.order[S.step],n=S.picks[name];if(ok)S.scores[name]+=n;sound(ok);S.lastValidation={name,n,ok,step:S.step,round:S.round,question:S.current};S.step++;S.current=null;S.revealed=false;S.choice=null;S.options=null;S.firstWrong=false;if(S.step>=S.names.length){S.stage='between';save();between()}else ratingShow()}
function declareWrong(){let name=S.order[S.step];if(S.revealed)return;if(S.jokers&&!S.firstWrong&&!S.jokerUsed[name].includes('chance')&&S.jokerUsed[name].length<(S.limit===20?2:1)){S.firstWrong=true;save();ratingShow()}else revealAnswer()}
function changeQuestion(){let name=S.order[S.step],n=S.picks[name];if(!S.jokers||S.revealed||S.firstWrong||S.jokerUsed[name].includes('change')||S.jokerUsed[name].length>=(S.limit===20?2:1))return;const pool=variantsFor(S.topic.theme,n).filter(x=>x.idx!==S.current.idx);if(!pool.length)return;S.jokerUsed[name].push('change');let item=shuffle(pool.filter(x=>!seenBy(name,S.topic.theme,n,x.idx)).length?pool.filter(x=>!seenBy(name,S.topic.theme,n,x.idx)):pool)[0];S.current={...item,name};S.wasRepeated=seenBy(name,S.topic.theme,n,item.idx);recordSeen(name,S.topic.theme,n,item.idx);S.options=item.idx===0?choicesFor(S.topic,n):null;S.choice=null;save();ratingShow()}
function secondChance(){let name=S.order[S.step];if(!S.firstWrong||!S.jokers||S.jokerUsed[name].includes('chance')||S.jokerUsed[name].length>=(S.limit===20?2:1))return;S.jokerUsed[name].push('chance');S.firstWrong=false;S.revealed=false;S.choice=null;save();ratingShow()}
function undoLast(){let l=S.lastValidation;if(!l||l.round!==S.round||S.step!==l.step+1)return alert('Correction disponible uniquement juste après la validation.');if(l.ok)S.scores[l.name]-=l.n;S.step=l.step;S.current=l.question;S.revealed=true;S.lastValidation=null;save();ratingShow()}
function between(){S.stage='between';save();app.innerHTML=`<div class="panel"><h2>Fin du thème ${S.round}</h2><button onclick="next()">${S.round>=S.limit?'Voir le classement final':'Thème suivant'}</button></div>${scores()}`}
function resume(){const s=read(KEY,null);if(!validSave(s)){clearSave();home();return}S=s;if(!S.profileIds)S.profileIds=Object.fromEntries(S.names.map(name=>[name,createProfile(name).id]));S.topic=bank.ratings.find(t=>t.theme===s.topic.theme);if(!S.jokerUsed)S.jokerUsed=Object.fromEntries(S.names.map(n=>[n,[]]));if(S.stage==='pick')ratingPick();else if(S.stage==='between')between();else ratingShow()}
window.addEventListener('pagehide',()=>{if(validSave(S))save()});
home();</script></body></html>
