// QCM pour certaines questions : indices de niveau (1 à 10) et trois distracteurs.
const mcq={'Géographie':{7:['Sydney','Melbourne','Perth']},'Cuisine':{6:['Caramélisation','Fermentation lactique','Osmose']},'Sport':{9:['155','167','180']},'Sciences':{7:['Ag','Fe','Hg']},'Cinéma':{10:['Hayao Miyazaki','Yasujirō Ozu','Kenji Mizoguchi']},'Bricolage':{3:['Un fil à plomb','Une équerre','Un mètre ruban']},'Astronomie':{4:['7','9','10']},'Histoire':{2:['1788','1792','1804']},'Musique':{6:['Trinité-et-Tobago','Cuba','Barbade']},'Animaux':{3:['6','10','12']},'Mathématiques':{5:['3,41','3,04','3,24']},'Littérature':{4:['Émile Zola','Alexandre Dumas','Honoré de Balzac']},'Football':{6:['Argentine','Allemagne','Brésil']},'Cuisine du monde':{6:['Italie','Portugal','Grèce']},'Cinéma français':{5:['Bienvenue chez les Ch’tis','Le Sens de la fête','Les Petits Mouchoirs']},'Géographie française':{5:['Bordeaux','Lyon','Montpellier']},'Inventions':{6:['Louis Pasteur','Robert Koch','Marie Curie']},'Sport olympique':{3:['4','6','7']},'Internet':{2:['#','&','%']},'Architecture et bâtiments':{7:['Béton allégé','Béton apparent','Béton architectonique']}};
function choicesFor(topic,n){let wrong=mcq[topic.theme]?.[n];if(!wrong)return null;let answer=topic.a[n-1];return shuffle([answer,...wrong]).map(x=>({text:x,correct:x===answer}));}
let S={},timer=null;
const app=document.getElementById('app');
const KEY='note10_save_v4',HISTORY='note10_used_topics_v4',PROFILES='note10_profiles_v4';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function read(k,def){try{let v=localStorage.getItem(k);return v===null?def:JSON.parse(v)}catch(e){return def}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function getProfiles(){const p=read(PROFILES,[]);return Array.isArray(p)?p.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&Array.isArray(x.seen)):[]}
function putProfiles(p){write(PROFILES,p)}
function profileFor(name){return getProfiles().find(p=>p.name.toLocaleLowerCase('fr')===name.toLocaleLowerCase('fr'))}
function createProfile(name){let p=getProfiles();let found=p.find(x=>x.name.toLocaleLowerCase('fr')===name.toLocaleLowerCase('fr'));if(found)return found;const item={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,9),name,seen:[]};p.push(item);putProfiles(p);return item}
function questionId(theme,n){return theme+'::'+n}
function seenBy(name,theme,n){const id=S.profileIds?.[name];return getProfiles().some(p=>p.id===id&&p.seen.includes(questionId(theme,n)))}
function recordSeen(name,theme,n){const id=S.profileIds?.[name];if(!id)return;const p=getProfiles(),one=p.find(x=>x.id===id),key=questionId(theme,n);if(one&&!one.seen.includes(key)){one.seen.push(key);putProfiles(p)}}
function profileList(){const p=getProfiles();return p.length?'<p class="muted">Profils enregistrés : '+p.map(x=>esc(x.name)+' ('+x.seen.length+' questions)').join(' · ')+'</p>':''}
function clearSave(){try{localStorage.removeItem(KEY)}catch(e){}}
function save(){write(KEY,S)}
function validSave(s){return s&&s.type==='ratings'&&Array.isArray(s.names)&&s.names.length>=2&&s.names.length<=10&&Number.isInteger(s.round)&&s.round>=1&&s.round<=20&&[5,10,20].includes(s.limit)&&s.scores&&s.topic&&bank.ratings.some(t=>t.theme===s.topic.theme)&&Array.isArray(s.order)&&s.order.length===s.names.length&&s.picks&&['pick','question','between'].includes(s.stage)}
function pickTheme(){let used=read(HISTORY,[]);if(!Array.isArray(used))used=[];const all=bank.ratings.map(t=>t.theme);used=used.filter(t=>all.includes(t));let choices=all.filter(t=>!used.includes(t));if(!choices.length){const last=used[used.length-1];used=[];choices=all.filter(t=>t!==last);if(!choices.length)choices=all}const playerNames=S.names||[];const scored=choices.map(theme=>({theme,seen:playerNames.reduce((total,player)=>total+Array.from({length:10},(_,i)=>seenBy(player,theme,i+1)?1:0).reduce((a,b)=>a+b,0),0)}));const min=Math.min(...scored.map(x=>x.seen));const eligible=scored.filter(x=>x.seen===min);const name=eligible[Math.floor(Math.random()*eligible.length)].theme;used.push(name);write(HISTORY,used);return bank.ratings.find(t=>t.theme===name)}
function stop(){if(timer)clearInterval(timer);timer=null}
function home(){stop();const saved=read(KEY,null);app.innerHTML=`<div class="panel"><h2>Note-toi de 1 à 10</h2><p>Un thème commun, une note unique par joueur, et des questions à l’oral. Bonne réponse : autant de points que la note choisie.</p><p class="muted">30 thèmes · 300 questions · QCM exceptionnels · profils et historique individuel</p>${validSave(saved)?`<button onclick="resume()">▶ Reprendre la partie (thème ${saved.round}/${saved.limit})</button> <button class="secondary" onclick="newGame()">Nouvelle partie</button>`:`<button onclick="setup()">Créer une partie</button>`}</div><p class="muted">Les profils, les questions vues, les thèmes déjà joués et la partie en cours sont conservés sur cet appareil, dans ce navigateur. Un prénom identique désigne le même profil.</p>`}
function newGame(){if(validSave(read(KEY,null))&&!confirm('Abandonner la partie en cours et repartir de zéro ?'))return;clearSave();setup()}
function setup(){stop();app.innerHTML=`<div class="panel"><h2>Préparer la partie</h2><label for="names">Prénoms des joueurs (séparés par une virgule)</label><input id="names" value="Alex, Sam, Camille, Lou"><label for="count">Nombre de thèmes</label><select id="count"><option value="5">5 thèmes</option><option value="10">10 thèmes</option><option value="20">20 thèmes</option></select><p class="muted">De 2 à 10 joueurs. Un prénom déjà enregistré réutilise son historique sur cet appareil. Pour deux personnes ayant le même prénom, ajoute un surnom distinct (ex. Lucas 2).</p>${profileList()}<button onclick="start()">Commencer</button> <button class="secondary" onclick="home()">Retour</button></div>`}
function start(){let names=document.getElementById('names').value.split(',').map(x=>x.trim()).filter(Boolean),n=+document.getElementById('count').value;if(names.length<2||names.length>10||new Set(names.map(x=>x.toLocaleLowerCase('fr'))).size!==names.length){alert('Indique 2 à 10 prénoms différents.');return}const profileIds=Object.fromEntries(names.map(name=>[name,createProfile(name).id]));S={type:'ratings',round:0,names,profileIds,limit:n,scores:Object.fromEntries(names.map(x=>[x,0])),order:[],step:0,picks:{}};next()}
function scores(){return '<div class="panel"><b>Scores</b>'+S.names.map(n=>`<div class="score"><span>${esc(n)}</span><b>${S.scores[n]} pts</b></div>`).join('')+'</div>'}
function finish(){stop();clearSave();let sorted=[...S.names].sort((a,b)=>S.scores[b]-S.scores[a]);app.innerHTML=`<div class="panel"><h2>Partie terminée</h2><p>En tête : <b>${esc(sorted.filter(n=>S.scores[n]===S.scores[sorted[0]]).join(' et '))}</b></p></div>${scores()}<button onclick="setup()">Nouvelle partie</button>`}
function next(){stop();if(S.round>=S.limit)return finish();S.round++;S.topic=pickTheme();S.order=shuffle(S.names);S.picks={};S.step=0;S.stage='pick';save();ratingPick()}
function ratingPick(){S.stage='pick';save();let player=S.order[Object.keys(S.picks).length];app.innerHTML=`<div class="panel"><span class="tag">Thème ${S.round}/${S.limit}</span><h2>${esc(S.topic.theme)}</h2>${player?`<p>À <b>${esc(player)}</b> de choisir sa note.</p><p class="muted">Les notes marquées ↻ correspondent à une question déjà vue par ce profil.</p><div class="grid">${Array.from({length:10},(_,i)=>`<button ${Object.values(S.picks).includes(i+1)?'disabled':''} onclick="choose(${i+1})">${i+1}${player&&seenBy(player,S.topic.theme,i+1)?' ↻':''}</button>`).join('')}</div>`:'<p>Toutes les notes ont été choisies.</p><button onclick="ratingQuestion()">Afficher les questions</button>'}<p class="muted">${Object.entries(S.picks).map(([n,v])=>esc(n)+': '+v).join(' · ')}</p></div>${scores()}`}
function choose(n){if(!Number.isInteger(n)||n<1||n>10||Object.values(S.picks).includes(n)||Object.keys(S.picks).length>=S.names.length)return;S.picks[S.order[Object.keys(S.picks).length]]=n;ratingPick()}
function ratingQuestion(){S.step=0;S.displayKey=null;S.wasRepeated=false;S.stage='question';S.revealed=false;S.choice=null;S.options=null;save();ratingShow()}
function choicesFor(topic,n){let wrong=mcq[topic.theme]?.[n];if(!wrong)return null;return shuffle([topic.a[n-1],...wrong])}
function ratingShow(){S.stage='question';save();let name=S.order[S.step],n=S.picks[name];const questionKey=questionId(S.topic.theme,n);if(S.displayKey!==name+'|'+questionKey){S.displayKey=name+'|'+questionKey;S.wasRepeated=seenBy(name,S.topic.theme,n)}const repeated=!!S.wasRepeated;recordSeen(name,S.topic.theme,n);if(!S.options)S.options=choicesFor(S.topic,n);let opts=S.options;save();app.innerHTML=`<div class="panel"><span class="tag">Thème ${S.round}/${S.limit} · ${esc(S.topic.theme)} · ${S.step+1}/${S.names.length}</span><h2>${esc(name)} — niveau ${n}</h2>${repeated?'<p class="notice">↻ Cette question a déjà été vue par ce joueur. Choisis une autre note lors d’une prochaine partie pour varier.</p>':''}<p>${esc(S.topic.q[n-1])}</p>${opts?`<p class="choice-label">QCM : le joueur annonce sa réponse à l’oral.</p><div id="options">${opts.map((o,i)=>`<button class="answer" onclick="selectOption(${i})" data-correct="${o===S.topic.a[n-1]}">${esc(o)}</button>`).join('')}</div>`:''}<button class="secondary" onclick="revealAnswer()">Révéler la réponse</button><div id="reveal" class="hidden notice"><b>Bonne réponse : ${esc(S.topic.a[n-1])}</b><p>La réponse donnée est-elle correcte ?</p><button onclick="ratingMark(true)">Oui (+${n})</button><button class="secondary" onclick="ratingMark(false)">Non (0)</button></div></div>${scores()}`;if(S.revealed)revealAnswer();else if(S.choice!==null&&opts){let buttons=[...document.querySelectorAll('#options button')];buttons.forEach((b,i)=>b.classList.toggle('on',i===S.choice))}}
function selectOption(i){let buttons=[...document.querySelectorAll('#options button')];if(S.revealed)return;buttons.forEach((b,j)=>b.classList.toggle('on',i===j));S.choice=i;save()}
function revealAnswer(){S.revealed=true;save();document.getElementById('reveal').classList.remove('hidden');let buttons=[...document.querySelectorAll('#options button')];buttons.forEach((b,i)=>{b.disabled=true;if(b.dataset.correct==='true')b.classList.add('correct');else if(S.choice===i)b.classList.add('wrong')})}
function ratingMark(ok){if(!S.revealed)return;let name=S.order[S.step];if(ok)S.scores[name]+=S.picks[name];S.step++;S.displayKey=null;S.wasRepeated=false;S.revealed=false;S.choice=null;S.options=null;if(S.step>=S.names.length){S.stage='between';save();between()}else ratingShow()}
function between(){S.stage='between';save();app.innerHTML=`<div class="panel"><h2>Fin du thème ${S.round}</h2><button onclick="next()">${S.round>=S.limit?'Voir le classement final':'Thème suivant'}</button></div>${scores()}`}
function resume(){const s=read(KEY,null);if(!validSave(s)){clearSave();home();return}S=s;if(!S.profileIds)S.profileIds=Object.fromEntries(S.names.map(name=>[name,createProfile(name).id]));S.topic=bank.ratings.find(t=>t.theme===s.topic.theme);if(S.stage==='pick')ratingPick();else if(S.stage==='between')between();else ratingShow()}
window.addEventListener('pagehide',()=>{if(validSave(S))save()});
home();</script></body></html>
