<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171329"><title>Note-toi de 1 à 10</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f8f6ff;background:#171329}*{box-sizing:border-box}body{margin:0}main{max-width:700px;margin:auto;padding:20px 16px 70px}h1{font-size:2rem;margin:12px 0}h2{font-size:1.4rem}p{line-height:1.5;color:#d2cbe5}.panel{background:#28213d;border:1px solid #493b66;border-radius:18px;padding:18px;margin:14px 0}.muted{color:#bcb2d2;font-size:.9rem}.tag{color:#d8b6ff;font-weight:700}button,select,input{font:inherit;border-radius:12px;padding:12px;border:1px solid #6e5a91}button{background:#9d64f2;color:white;cursor:pointer;font-weight:700;margin:4px 3px 4px 0}button.secondary{background:#413554}button:disabled{opacity:.35;cursor:default}input,select{background:#171329;color:white;max-width:100%;margin:4px 0}input{width:100%}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.grid button{margin:0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.answer{display:block;width:100%;text-align:left;margin:7px 0;background:#40335d}.answer.on{background:#1b745e}.answer.correct{background:#167b61}.answer.wrong{background:#9b3f55}.answer:disabled{opacity:1}.choice-label{font-size:.85rem;color:#c9bce3}.answer.bomb{background:#913e4d}.score{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #534567}.hidden{display:none}.big{font-size:2.5rem;font-weight:800}.notice{padding:10px;background:#3e3157;border-radius:12px;margin:10px 0}small{color:#c8bfd8}</style></head><body><main><header><button type="button" class="secondary" onclick="home()">⌂ Nouvelle partie</button><h1>Note-toi de 1 à 10</h1><p>Un thème commun, une note unique par joueur, des questions à l’oral.</p></header><div id="app"></div></main><script>
const bank={ratings:[
{theme:'Bricolage',q:['Quel outil sert à enfoncer un clou ?','Comment appelle-t-on l’outil servant à serrer une vis ?','Quel instrument vérifie qu’une surface est horizontale ?','Quel matériau obtient-on en mélangeant ciment, sable et eau ?','Quel type de cheville utilise-t-on généralement pour une cloison creuse en plaque de plâtre ?','Quel est le rôle d’un disjoncteur dans une installation électrique ?','Que signifie le marquage IP44 sur un appareil électrique ?','Dans une installation domestique française récente, quelle couleur est réservée au conducteur de protection (terre) ?','Quelle est la différence entre un circuit électrique en série et un circuit en parallèle ?','Pourquoi doit-on vérifier l’absence de tension avec un appareil adapté avant de travailler sur un circuit ?'],a:['Marteau','Tournevis','Niveau à bulle','Mortier','Cheville pour corps creux, par exemple Molly','Couper le courant en cas de surcharge ou de court-circuit','Protection contre les corps solides de plus de 1 mm et les projections d’eau','Vert et jaune','En série, un seul chemin pour le courant ; en parallèle, plusieurs branches','Parce qu’une coupure apparente ne garantit pas qu’un conducteur est hors tension']},
{theme:'Géographie',q:['Quelle est la capitale de la France ?','Sur quel continent se trouve le Brésil ?','Quel océan borde la côte ouest de la France ?','Quel pays a pour capitale Madrid ?','Quelle chaîne de montagnes sépare en partie la France de l’Espagne ?','Quel fleuve traverse Paris ?','Quelle est la capitale de l’Australie ?','Dans quel pays se trouve le Kilimandjaro ?','Quel détroit sépare l’Espagne du Maroc ?','Quel pays est entièrement enclavé dans l’Afrique du Sud ?'],a:['Paris','Amérique du Sud','Océan Atlantique','Espagne','Pyrénées','Seine','Canberra','Tanzanie','Détroit de Gibraltar','Lesotho']},
{theme:'Cuisine',q:['Quel fruit sert à préparer un guacamole ?','De quel animal vient traditionnellement le lait utilisé pour le roquefort ?','Quel ingrédient principal entre dans la préparation du houmous ?','Quel féculent utilise-t-on pour préparer un risotto ?','Quel condiment est obtenu à partir de graines de moutarde ?','Quel est le nom de la réaction de brunissement des aliments liée à la chaleur entre sucres et acides aminés ?','Quelle sauce classique est une émulsion de jaune d’œuf et de beurre clarifié ?','Quel ingrédient permet à une pâte à pain de lever par fermentation ?','Quel est le nom japonais du bouillon de base souvent préparé avec kombu et bonite ?','À quelle température approximative l’eau bout-elle au niveau de la mer sous pression atmosphérique normale ?'],a:['Avocat','Brebis','Pois chiches','Riz','Moutarde','Réaction de Maillard','Sauce hollandaise','Levure boulangère ou levain','Dashi','100 °C']},
{theme:'Sport',q:['Combien de joueurs une équipe de football aligne-t-elle sur le terrain au coup d’envoi ?','Quel sport utilise un volant ?','Combien de points vaut un lancer franc au basket-ball ?','Quel pays accueille traditionnellement le tournoi de Wimbledon ?','Combien de joueurs une équipe de handball aligne-t-elle sur le terrain, gardien compris ?','Quelle distance mesure un marathon officiel ?','Au tennis, comment appelle-t-on un score de 40-40 ?','Dans quel sport parle-t-on de mêlée ?','Quel est le nombre maximal de points d’un break au snooker ?','Quel nageur américain a remporté huit médailles d’or aux Jeux olympiques de Pékin 2008 ?'],a:['11','Badminton','1','Royaume-Uni','7','42,195 km','Égalité (deuce)','Rugby','147','Michael Phelps']},
{theme:'Sciences',q:['Quelle planète est surnommée la planète rouge ?','Quel gaz respirons-nous principalement dans l’air ?','Combien de pattes a un insecte adulte ?','Quel organe pompe le sang ?','Quelle est la formule chimique de l’eau ?','Quelle force maintient les planètes en orbite autour du Soleil ?','Quel est le symbole chimique de l’or ?','Quel scientifique a proposé la théorie de la relativité restreinte ?','Comment appelle-t-on le changement direct d’un solide en gaz ?','Quelle particule porte une charge électrique négative ?'],a:['Mars','Azote (diazote)','6','Cœur','H₂O','Gravitation','Au','Albert Einstein','Sublimation','Électron']},
{theme:'Cinéma',q:['Quel personnage porte un sabre laser dans Star Wars ?','Quel film met en scène un paquebot appelé Titanic ?','Quel animal est Simba dans Le Roi lion ?','Qui a réalisé Jurassic Park (1993) ?','Quel acteur incarne Jack Sparrow ?','Quel réalisateur a signé Inception ?','Quel film d’animation Pixar met en scène Woody et Buzz ?','Dans quel film trouve-t-on le personnage de Tyler Durden ?','Quel film de 1927 de Fritz Lang représente une ville futuriste ?','Quel réalisateur japonais a réalisé Les Sept Samouraïs ?'],a:['Un Jedi ou un Sith','Titanic','Lion','Steven Spielberg','Johnny Depp','Christopher Nolan','Toy Story','Fight Club','Metropolis','Akira Kurosawa']}
]};
// QCM pour certaines questions : indices de niveau (1 à 10) et trois distracteurs.
const mcq={
 'Bricolage':{3:['Un fil à plomb','Une équerre','Un mètre ruban'],7:['Une résistance aux chocs de 44 joules','Une protection contre une immersion de 44 minutes','Une classe de rendement énergétique'],8:['Bleu','Rouge','Noir']},
 'Géographie':{7:['Sydney','Melbourne','Perth'],8:['Kenya','Ouganda','Éthiopie'],10:['Eswatini','Botswana','Namibie']},
 'Cuisine':{6:['Caramélisation','Fermentation lactique','Osmose'],7:['Béchamel','Mayonnaise','Sauce tomate'],9:['Miso','Ponzu','Mirin']},
 'Sport':{6:['40 km','42 km','45,195 km'],9:['155','167','180'],10:['Ryan Lochte','Mark Spitz','Caeleb Dressel']},
 'Sciences':{5:['CO₂','O₂','H₂O₂'],7:['Ag','Fe','Hg'],9:['Condensation','Fusion','Solidification']},
 'Cinéma':{4:['James Cameron','George Lucas','Ridley Scott'],6:['Denis Villeneuve','David Fincher','Peter Jackson'],10:['Hayao Miyazaki','Yasujirō Ozu','Kenji Mizoguchi']}
};
function choicesFor(topic,n){let wrong=mcq[topic.theme]?.[n];if(!wrong)return null;let answer=topic.a[n-1];return shuffle([answer,...wrong]).map(x=>({text:x,correct:x===answer}));}
let S={},timer=null;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>[...a].sort(()=>Math.random()-.5);function draw(type,len){let ids=[];try{ids=JSON.parse(localStorage.getItem('used_'+type)||'[]')}catch(e){}let available=Array.from({length:len},(_,i)=>i).filter(i=>!ids.includes(i));if(!available.length){ids=[];available=Array.from({length:len},(_,i)=>i)}let n=available[Math.floor(Math.random()*available.length)];ids.push(n);try{localStorage.setItem('used_'+type,JSON.stringify(ids))}catch(e){}return n}function stop(){if(timer)clearInterval(timer);timer=null}function home(){stop();app.innerHTML=`<div class="panel"><h2>Note-toi de 1 à 10</h2><p>Un thème est tiré au sort. Chaque joueur choisit une note de 1 à 10, qui devient indisponible pour les autres. Une bonne réponse rapporte autant de points que la note choisie.</p><button onclick="setup('ratings')">Créer une partie</button></div><p class="muted">Version de démonstration : nombre limité de thèmes, à enrichir pour éviter les répétitions.</p>`}function setup(){stop();S={type:'ratings',round:0};app.innerHTML=`<div class="panel"><h2>Préparer la partie</h2><label>Prénoms des joueurs (séparés par une virgule)</label><input id="names" value="Alex, Sam, Camille, Lou"><label>Nombre de thèmes</label><select id="count"><option value="5">5 thèmes</option><option value="10">10 thèmes</option><option value="20">20 thèmes</option></select><p class="muted">De 2 à 10 joueurs. L’ordre de choix change à chaque thème.</p><button onclick="start()">Commencer</button></div>`}function start(){let names=document.getElementById('names').value.split(',').map(x=>x.trim()).filter(Boolean),n=+document.getElementById('count').value;if(names.length!==(S.type==='ten'?2:names.length)||names.length<(S.type==='bluff'?3:2)||names.length>10||new Set(names).size!==names.length){alert('Vérifiez les noms et le nombre de joueurs.');return}S.names=names;S.limit=n;S.scores=Object.fromEntries(names.map(x=>[x,0]));S.order=[];S.step=0;next()}function scores(){return '<div class="panel"><b>Scores</b>'+S.names.map(n=>`<div class="score"><span>${esc(n)}</span><b>${S.scores[n]} pts</b></div>`).join('')+'</div>'}function finish(){stop();let sorted=[...S.names].sort((a,b)=>S.scores[b]-S.scores[a]);app.innerHTML=`<div class="panel"><h2>Partie terminée</h2><p>En tête : <b>${esc(sorted.filter(n=>S.scores[n]===S.scores[sorted[0]]).join(' et '))}</b></p></div>${scores()}<button onclick="setup(S.type)">Nouvelle partie</button>`}function next(){stop();if(S.round>=S.limit)return finish();ratingRound()}function ratingRound(){S.round++;S.topic=bank.ratings[draw('ratings',bank.ratings.length)];S.order=shuffle(S.names);S.picks={};ratingPick()}function ratingPick(){let player=S.order[Object.keys(S.picks).length];app.innerHTML=`<div class="panel"><span class="tag">Thème ${S.round}/${S.limit}</span><h2>${esc(S.topic.theme)}</h2>${player?`<p>À <b>${esc(player)}</b> de choisir sa note.</p><div class="grid">${Array.from({length:10},(_,i)=>`<button ${Object.values(S.picks).includes(i+1)?'disabled':''} onclick="choose(${i+1})">${i+1}</button>`).join('')}</div>`:'<p>Toutes les notes ont été choisies.</p><button onclick="ratingQuestion()">Afficher les questions</button>'}<p class="muted">${Object.entries(S.picks).map(([n,v])=>esc(n)+': '+v).join(' · ')}</p></div>${scores()}`}function choose(n){if(Object.values(S.picks).includes(n)||n<1||n>10)return;S.picks[S.order[Object.keys(S.picks).length]]=n;ratingPick()}function ratingQuestion(){S.step=0;ratingShow()}function ratingShow(){let name=S.order[S.step],n=S.picks[name],opts=choicesFor(S.topic,n);S.choice=null;app.innerHTML=`<div class="panel"><span class="tag">${esc(S.topic.theme)} · ${S.step+1}/${S.names.length}</span><h2>${esc(name)} — niveau ${n}</h2><p>${esc(S.topic.q[n-1])}</p>${opts?`<p class="choice-label">Question à choix multiples : le joueur annonce sa réponse, puis l'animateur sélectionne la proposition.</p><div id="options">${opts.map((o,i)=>`<button class="answer" onclick="selectOption(${i})" data-correct="${o.correct}">${esc(o.text)}</button>`).join('')}</div>`:''}<button class="secondary" onclick="revealAnswer()">Révéler la réponse</button><div id="reveal" class="hidden notice"><b>Bonne réponse : ${esc(S.topic.a[n-1])}</b><p>La réponse donnée est-elle correcte ?</p><button onclick="ratingMark(true)">Oui (+${n})</button><button class="secondary" onclick="ratingMark(false)">Non (0)</button></div></div>${scores()}`}
function selectOption(i){let buttons=[...document.querySelectorAll('#options button')];buttons.forEach((b,j)=>{b.classList.toggle('on',i===j)});S.choice=i}
function revealAnswer(){document.getElementById('reveal').classList.remove('hidden');let buttons=[...document.querySelectorAll('#options button')];buttons.forEach((b,i)=>{b.disabled=true;if(b.dataset.correct==='true')b.classList.add('correct');else if(S.choice===i)b.classList.add('wrong')})}
function ratingMark(ok){let name=S.order[S.step];if(ok)S.scores[name]+=S.picks[name];S.step++;if(S.step>=S.names.length){app.innerHTML=`<div class="panel"><h2>Fin du thème ${S.round}</h2><button onclick="next()">Thème suivant</button></div>${scores()}`}else ratingShow()}
home();</script></body></html>
