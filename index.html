function choicesFor(topic,n){let wrong=mcq[topic.theme]?.[n];if(!wrong)return null;let answer=topic.a[n-1];return shuffle([answer,...wrong]).map(x=>({text:x,correct:x===answer}));}
let S={},timer=null;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};function draw(type,len){let ids=[];try{ids=JSON.parse(localStorage.getItem('used_'+type)||'[]')}catch(e){}let available=Array.from({length:len},(_,i)=>i).filter(i=>!ids.includes(i));if(!available.length){let last=ids[ids.length-1];ids=[];available=Array.from({length:len},(_,i)=>i).filter(i=>len===1||i!==last)}let n=available[Math.floor(Math.random()*available.length)];ids.push(n);try{localStorage.setItem('used_'+type,JSON.stringify(ids))}catch(e){}return n}function stop(){if(timer)clearInterval(timer);timer=null}function home(){stop();app.innerHTML=`<div class="panel"><h2>Note-toi de 1 à 10</h2><p>Un thème est tiré au sort. Chaque joueur choisit une note de 1 à 10, qui devient indisponible pour les autres. Une bonne réponse rapporte autant de points que la note choisie.</p><p class="muted">20 thèmes · 200 questions · QCM exceptionnels · historique local</p><button onclick="setup('ratings')">Créer une partie</button></div><p class="muted">20 thèmes et 200 questions, dont quelques QCM. Les thèmes déjà joués sont mémorisés sur cet appareil.</p>`}function setup(){stop();S={type:'ratings',round:0};app.innerHTML=`<div class="panel"><h2>Préparer la partie</h2><label>Prénoms des joueurs (séparés par une virgule)</label><input id="names" value="Alex, Sam, Camille, Lou"><label>Nombre de thèmes</label><select id="count"><option value="5">5 thèmes</option><option value="10">10 thèmes</option><option value="20">20 thèmes</option></select><p class="muted">De 2 à 10 joueurs. L’ordre de choix change à chaque thème.</p><button onclick="start()">Commencer</button></div>`}function start(){let names=document.getElementById('names').value.split(',').map(x=>x.trim()).filter(Boolean),n=+document.getElementById('count').value;if(names.length!==(S.type==='ten'?2:names.length)||names.length<(S.type==='bluff'?3:2)||names.length>10||new Set(names).size!==names.length){alert('Vérifiez les noms et le nombre de joueurs.');return}S.names=names;S.limit=n;S.scores=Object.fromEntries(names.map(x=>[x,0]));S.order=[];S.step=0;next()}function scores(){return '<div class="panel"><b>Scores</b>'+S.names.map(n=>`<div class="score"><span>${esc(n)}</span><b>${S.scores[n]} pts</b></div>`).join('')+'</div>'}function finish(){stop();let sorted=[...S.names].sort((a,b)=>S.scores[b]-S.scores[a]);app.innerHTML=`<div class="panel"><h2>Partie terminée</h2><p>En tête : <b>${esc(sorted.filter(n=>S.scores[n]===S.scores[sorted[0]]).join(' et '))}</b></p></div>${scores()}<button onclick="setup(S.type)">Nouvelle partie</button>`}function next(){stop();if(S.round>=S.limit)return finish();ratingRound()}function ratingRound(){S.round++;S.topic=bank.ratings[draw('ratings',bank.ratings.length)];S.order=shuffle(S.names);S.picks={};ratingPick()}function ratingPick(){let player=S.order[Object.keys(S.picks).length];app.innerHTML=`<div class="panel"><span class="tag">Thème ${S.round}/${S.limit}</span><h2>${esc(S.topic.theme)}</h2>${player?`<p>À <b>${esc(player)}</b> de choisir sa note.</p><div class="grid">${Array.from({length:10},(_,i)=>`<button ${Object.values(S.picks).includes(i+1)?'disabled':''} onclick="choose(${i+1})">${i+1}</button>`).join('')}</div>`:'<p>Toutes les notes ont été choisies.</p><button onclick="ratingQuestion()">Afficher les questions</button>'}<p class="muted">${Object.entries(S.picks).map(([n,v])=>esc(n)+': '+v).join(' · ')}</p></div>${scores()}`}function choose(n){if(Object.values(S.picks).includes(n)||n<1||n>10)return;S.picks[S.order[Object.keys(S.picks).length]]=n;ratingPick()}function ratingQuestion(){S.step=0;ratingShow()}function ratingShow(){let name=S.order[S.step],n=S.picks[name],opts=choicesFor(S.topic,n);S.choice=null;app.innerHTML=`<div class="panel"><span class="tag">${esc(S.topic.theme)} · ${S.step+1}/${S.names.length}</span><h2>${esc(name)} — niveau ${n}</h2><p>${esc(S.topic.q[n-1])}</p>${opts?`<p class="choice-label">Question à choix multiples : le joueur annonce sa réponse, puis l'animateur sélectionne la proposition.</p><div id="options">${opts.map((o,i)=>`<button class="answer" onclick="selectOption(${i})" data-correct="${o.correct}">${esc(o.text)}</button>`).join('')}</div>`:''}<button class="secondary" onclick="revealAnswer()">Révéler la réponse</button><div id="reveal" class="hidden notice"><b>Bonne réponse : ${esc(S.topic.a[n-1])}</b><p>La réponse donnée est-elle correcte ?</p><button onclick="ratingMark(true)">Oui (+${n})</button><button class="secondary" onclick="ratingMark(false)">Non (0)</button></div></div>${scores()}`}
function selectOption(i){let buttons=[...document.querySelectorAll('#options button')];buttons.forEach((b,j)=>{b.classList.toggle('on',i===j)});S.choice=i}
function revealAnswer(){document.getElementById('reveal').classList.remove('hidden');let buttons=[...document.querySelectorAll('#options button')];buttons.forEach((b,i)=>{b.disabled=true;if(b.dataset.correct==='true')b.classList.add('correct');else if(S.choice===i)b.classList.add('wrong')})}
function ratingMark(ok){let name=S.order[S.step];if(ok)S.scores[name]+=S.picks[name];S.step++;if(S.step>=S.names.length){app.innerHTML=`<div class="panel"><h2>Fin du thème ${S.round}</h2><button onclick="next()">Thème suivant</button></div>${scores()}`}else ratingShow()}
home();</script></body></html>
